version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "simon", email = "wsm5432109876@qq.com" }
]
requires-python = ">=3.10"
dependencies = [
    "chromadb>=1.5.9",
    "langchain>=1.4.0",
    "langchain-ollama>=1.1.0",
