[project]
name = "rag-agent"
version = "0.2.0"
description = "Local research assistant with handwritten ReAct and evidence retrieval"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
 "chromadb>=1.5,<2", "onnxruntime>=1.23,<2", "jieba>=0.42", "langchain-text-splitters>=1.1,<2",
 "ollama>=0.6,<1", "pymupdf>=1.28,<2", "python-docx>=1.2,<2",
 "rank-bm25>=0.2", "streamlit>=1.64,<2", "python-dotenv>=1.2",
 "matplotlib>=3.10", "pandas>=2.3", "pypdf>=6", "pdfplumber>=0.11",
 "sentence-transformers>=5,<7", "truststore>=0.10", "tabulate>=0.9"
]
[dependency-groups]
dev = ["pytest>=9", "ruff>=0.14"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
